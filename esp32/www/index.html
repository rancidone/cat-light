<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Light Setup</title>
  <link rel="stylesheet" href="/pico.min.css">
  <script src="/alpine.min.js" defer></script>
  <script>
    // If we're not on the SoftAP IP, the device is on the home network — go straight to the app.
    if (window.location.hostname !== '192.168.4.1') {
      window.location.replace('/app.html');
    }
  </script>
</head>
<body>
  <main class="container" style="max-width:480px;margin-top:4rem" x-data="setup()">
    <hgroup>
      <h1>Cat Light</h1>
      <p>Connect your light to WiFi to get started.</p>
    </hgroup>

    <div x-show="!submitted">
      <form @submit.prevent="submit">
        <label>
          WiFi Network
          <input type="text" x-model="ssid" placeholder="Network name (SSID)" required autocomplete="off">
        </label>
        <label>
          Password
          <input type="password" x-model="password" placeholder="Network password" autocomplete="current-password">
        </label>
        <p x-show="error" x-text="error" style="color:var(--pico-color-red-500)"></p>
        <button type="submit" :aria-busy="loading" :disabled="loading">Connect</button>
      </form>
    </div>

    <article x-show="submitted">
      <h2>Almost there</h2>
      <p>Credentials saved. The light is connecting to your network — this page will stop responding shortly.</p>
      <ol>
        <li>Rejoin your home WiFi network</li>
        <li>Visit <strong><a href="http://cat-light.local/app.html">http://cat-light.local/app.html</a></strong></li>
      </ol>
    </article>
  </main>

  <script>
  function setup() {
    return {
      ssid: '', password: '',
      loading: false, submitted: false, error: '',

      async submit() {
        this.loading = true;
        this.error = '';
        try {
          const r = await fetch('/api/wifi/credentials', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ssid: this.ssid, password: this.password })
          });
          if (!r.ok) throw new Error();
          this.submitted = true;
        } catch {
          this.error = 'Could not save credentials. Try again.';
        } finally {
          this.loading = false;
        }
      }
    }
  }
  </script>
</body>
</html>
